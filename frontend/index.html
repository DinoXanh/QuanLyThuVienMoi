<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý thư viện</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header class="login-header">
        <h1>QUẢN LÝ THƯ VIỆN</h1>
        <button id="themeToggle" class="theme-button">
            Chế độ tối
        </button>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-title">
                <h2>Đăng nhập</h2>
                <p>Chào mừng bạn đến với thư viện</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tên đăng nhập"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="show-password">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Hiển thị mật khẩu</label>
                </div>

                <p id="loginMessage" class="login-message" role="alert"></p>

                <button type="submit" id="loginButton" class="btn-primary">
                    Đăng nhập
                </button>
            </form>

            <div class="login-footer">
                <p>Chưa có tài khoản?</p>
                <p>Vui lòng liên hệ thủ thư để được cấp tài khoản.</p>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        Hệ thống quản lý thư viện
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
